# Render Blueprint: n8n on the free plan, with all state in Supabase.
# Free web services sleep after 15 minutes without traffic (see docs/M0-checklist.md, step 3, for the pinger).
services:
  - type: web
    name: jarvis-n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:2.43.8 # pinned: the version M0 first ran on. Upgrade on purpose, not by accident.
    plan: free
    region: singapore
    envVars:
      # Network
      - key: N8N_PORT
        value: "10000"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        sync: false # your-service.onrender.com (no https://)
      - key: N8N_WEBHOOK_URL # replaces the deprecated WEBHOOK_URL
        sync: false # https://your-service.onrender.com/
      # Encryption key for stored credentials. Generated once; never change or lose it.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      # Database: Supabase, separate "n8n" schema (Jarvis data lives in the "jarvis" schema)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_SCHEMA
        value: n8n
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # Housekeeping: keep the free 500 MB database small
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      # Code-node runner: the free instance starts it slowly, so give it longer than the 30s default
      - key: N8N_RUNNERS_GRANT_TOKEN_TTL
        value: "120"
      # Time zone
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: TZ
        value: Asia/Kolkata